pipeline:
  name: pipeline_k8s_examples_build_ddbb
  id: pipeline_k8s_examples_build_ddbb
  clone:
    enabled: true
  stages:
    - id: validate
      name: Validate
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: list_manifests
          name: List Manifests
          run:
            shell: bash
            script: |-
              echo "Repository contains only Kubernetes manifest YAML files; no build or test toolchain is defined."
              echo "Listing manifest files:"
              find manifests -type f -name '*.yaml' -print
  tags:
    onboarding: "true"
